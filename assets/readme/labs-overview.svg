<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="ovwTitle ovwDesc">
  <title id="ovwTitle">实训列表墙</title>
  <desc id="ovwDesc">四个 Python 数据分析实训的详细卡片墙:每张卡片含编号、名称、技术栈与核心方法。</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <!-- 编号块:左侧圆角衔接卡片外框,右侧直角 -->
    <path id="ovwNum" d="M 10 0 L 80 0 L 80 110 L 10 110 A 10 10 0 0 1 0 100 L 0 10 A 10 10 0 0 1 10 0 Z" fill="#2F6E4F"/>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="360" rx="26" fill="#F5F3EC"/>

  <!-- 章节标题 -->
  <g transform="translate(48, 32)">
    <text class="sans" x="0" y="26" font-size="26" font-weight="700" fill="#1A1A1A">实训列表</text>
    <line x1="0" y1="40" x2="44" y2="40" stroke="#B8651B" stroke-width="3" stroke-linecap="round"/>
    <text class="mono" x="0" y="62" font-size="12" fill="#8B8680" letter-spacing="1.5">LABS OVERVIEW</text>
  </g>

  <!-- 2×2 详细卡片墙 -->
  <g transform="translate(48, 112)">
    <!-- 卡片 01 学生成绩分析 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="536" height="110" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <use href="#ovwNum"/>
      <text class="mono" x="40" y="55" font-size="32" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">01</text>
      <text class="sans" x="100" y="38" font-size="20" font-weight="600" fill="#1A1A1A">学生成绩分析</text>
      <text class="mono" x="100" y="62" font-size="13" fill="#2F6E4F">Pandas · NumPy</text>
      <text class="sans" x="100" y="88" font-size="14" fill="#8B8680">数据生成 · CSV 读写 · 条件筛选</text>
    </g>
    <!-- 卡片 02 特征工程 -->
    <g transform="translate(568, 0)">
      <rect x="0" y="0" width="536" height="110" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <use href="#ovwNum"/>
      <text class="mono" x="40" y="55" font-size="32" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">02</text>
      <text class="sans" x="100" y="38" font-size="20" font-weight="600" fill="#1A1A1A">特征工程</text>
      <text class="mono" x="100" y="62" font-size="13" fill="#2F6E4F">scikit-learn</text>
      <text class="sans" x="100" y="88" font-size="14" fill="#8B8680">缺失值 · 编码 · 缩放 · 选择 · 离散化</text>
    </g>
    <!-- 卡片 03 KNN 分类与线性回归 -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="536" height="110" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <use href="#ovwNum"/>
      <text class="mono" x="40" y="55" font-size="32" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">03</text>
      <text class="sans" x="100" y="38" font-size="20" font-weight="600" fill="#1A1A1A">KNN 分类与线性回归</text>
      <text class="mono" x="100" y="62" font-size="13" fill="#2F6E4F">scikit-learn</text>
      <text class="sans" x="100" y="88" font-size="14" fill="#8B8680">iris KNN 准确率 100% · wine 线性回归</text>
    </g>
    <!-- 卡片 04 身高体重相关性 -->
    <g transform="translate(568, 130)">
      <rect x="0" y="0" width="536" height="110" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <use href="#ovwNum"/>
      <text class="mono" x="40" y="55" font-size="32" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">04</text>
      <text class="sans" x="100" y="38" font-size="20" font-weight="600" fill="#1A1A1A">身高体重相关性</text>
      <text class="mono" x="100" y="62" font-size="13" fill="#2F6E4F">SciPy · Pandas · Matplotlib · Seaborn</text>
      <text class="sans" x="100" y="88" font-size="14" fill="#8B8680">Shapiro-Wilk · Pearson · Spearman</text>
    </g>
  </g>
</svg>

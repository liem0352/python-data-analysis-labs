<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" role="img" aria-labelledby="footTitle footDesc">
  <title id="footTitle">README 签名</title>
  <desc id="footDesc">README 制作签名与作者信息:使用 beautify-github-readme 技能制作,作者 liem,广东工商职业技术大学,Python 3.13。</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="100" rx="26" fill="#F5F3EC"/>

  <!-- 顶部赭石短线:签名收束 -->
  <line x1="568" y1="22" x2="632" y2="22" stroke="#B8651B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 签名行:README MADE WITH + 技能名 -->
  <text class="mono" x="600" y="48" font-size="11" fill="#8B8680" text-anchor="middle" letter-spacing="2">README MADE WITH</text>
  <text class="sans" x="600" y="70" font-size="15" font-weight="600" fill="#2F6E4F" text-anchor="middle">beautify-github-readme</text>

  <!-- 底部作者信息 -->
  <text class="mono" x="600" y="88" font-size="11" fill="#8B8680" text-anchor="middle">作者 liem · 广东工商职业技术大学 · Python 3.13</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="galTitle galDesc">
  <title id="galTitle">可视化画廊</title>
  <desc id="galDesc">五种数据分析常用图表样例:柱状图、折线图、散点图、箱线图、热力图,对应四个实训中产出的可视化类型。</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="360" rx="26" fill="#F5F3EC"/>

  <!-- 章节标题 -->
  <g transform="translate(48, 36)">
    <text class="sans" x="0" y="26" font-size="26" font-weight="700" fill="#1A1A1A">可视化画廊</text>
    <line x1="0" y1="40" x2="44" y2="40" stroke="#B8651B" stroke-width="3" stroke-linecap="round"/>
    <text class="mono" x="0" y="62" font-size="12" fill="#8B8680" letter-spacing="1.5">VISUALIZATION GALLERY</text>
  </g>

  <!-- 五张图表卡片:横排,每卡 204 宽 -->
  <g transform="translate(48, 112)">
    <!-- 卡片 1 柱状图 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="204" height="220" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <line x1="5" y1="140" x2="175" y2="140" stroke="#8B8680" stroke-width="1"/>
        <line x1="5" y1="10" x2="5" y2="140" stroke="#8B8680" stroke-width="1"/>
        <rect x="14" y="70" width="22" height="70" fill="#2F6E4F" opacity="0.85"/>
        <rect x="48" y="40" width="22" height="100" fill="#2F6E4F" opacity="0.85"/>
        <rect x="82" y="85" width="22" height="55" fill="#2F6E4F" opacity="0.85"/>
        <rect x="116" y="50" width="22" height="90" fill="#B8651B" opacity="0.85"/>
        <rect x="150" y="65" width="22" height="75" fill="#2F6E4F" opacity="0.85"/>
      </g>
      <text class="sans" x="102" y="200" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">柱状图</text>
    </g>
    <!-- 卡片 2 折线图 -->
    <g transform="translate(224, 0)">
      <rect x="0" y="0" width="204" height="220" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <line x1="5" y1="140" x2="175" y2="140" stroke="#8B8680" stroke-width="1"/>
        <line x1="5" y1="10" x2="5" y2="140" stroke="#8B8680" stroke-width="1"/>
        <polyline points="20,95 50,60 80,80 110,40 140,55 170,30" fill="none" stroke="#2F6E4F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="20" cy="95" r="3" fill="#2F6E4F"/>
        <circle cx="50" cy="60" r="3" fill="#2F6E4F"/>
        <circle cx="80" cy="80" r="3" fill="#2F6E4F"/>
        <circle cx="110" cy="40" r="3" fill="#B8651B"/>
        <circle cx="140" cy="55" r="3" fill="#2F6E4F"/>
        <circle cx="170" cy="30" r="3" fill="#2F6E4F"/>
      </g>
      <text class="sans" x="102" y="200" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">折线图</text>
    </g>
    <!-- 卡片 3 散点图 -->
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="204" height="220" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <line x1="5" y1="140" x2="175" y2="140" stroke="#8B8680" stroke-width="1"/>
        <line x1="5" y1="10" x2="5" y2="140" stroke="#8B8680" stroke-width="1"/>
        <circle cx="25" cy="45" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="50" cy="70" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="75" cy="35" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="95" cy="85" r="3.5" fill="#B8651B" opacity="0.8"/>
        <circle cx="120" cy="55" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="145" cy="95" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="35" cy="100" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="70" cy="115" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="110" cy="125" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="160" cy="75" r="3.5" fill="#2F6E4F" opacity="0.8"/>
        <circle cx="90" cy="60" r="3.5" fill="#B8651B" opacity="0.8"/>
        <circle cx="130" cy="40" r="3.5" fill="#2F6E4F" opacity="0.8"/>
      </g>
      <text class="sans" x="102" y="200" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">散点图</text>
    </g>
    <!-- 卡片 4 箱线图 -->
    <g transform="translate(672, 0)">
      <rect x="0" y="0" width="204" height="220" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <line x1="5" y1="140" x2="175" y2="140" stroke="#8B8680" stroke-width="1"/>
        <line x1="5" y1="10" x2="5" y2="140" stroke="#8B8680" stroke-width="1"/>
        <!-- 箱 1 -->
        <line x1="45" y1="25" x2="45" y2="125" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="35" y1="25" x2="55" y2="25" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="35" y1="125" x2="55" y2="125" stroke="#2F6E4F" stroke-width="1.5"/>
        <rect x="30" y="55" width="30" height="45" fill="#2F6E4F" opacity="0.25" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="30" y1="75" x2="60" y2="75" stroke="#2F6E4F" stroke-width="2"/>
        <!-- 箱 2 -->
        <line x1="95" y1="35" x2="95" y2="120" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="85" y1="35" x2="105" y2="35" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="85" y1="120" x2="105" y2="120" stroke="#2F6E4F" stroke-width="1.5"/>
        <rect x="80" y="50" width="30" height="40" fill="#B8651B" opacity="0.25" stroke="#B8651B" stroke-width="1.5"/>
        <line x1="80" y1="68" x2="110" y2="68" stroke="#B8651B" stroke-width="2"/>
        <!-- 箱 3 -->
        <line x1="145" y1="45" x2="145" y2="130" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="135" y1="45" x2="155" y2="45" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="135" y1="130" x2="155" y2="130" stroke="#2F6E4F" stroke-width="1.5"/>
        <rect x="130" y="70" width="30" height="40" fill="#2F6E4F" opacity="0.25" stroke="#2F6E4F" stroke-width="1.5"/>
        <line x1="130" y1="90" x2="160" y2="90" stroke="#2F6E4F" stroke-width="2"/>
      </g>
      <text class="sans" x="102" y="200" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">箱线图</text>
    </g>
    <!-- 卡片 5 热力图 -->
    <g transform="translate(896, 0)">
      <rect x="0" y="0" width="204" height="220" rx="10" fill="#FFFFFF" stroke="#2F6E4F" stroke-width="1"/>
      <g transform="translate(12, 16)">
        <line x1="5" y1="140" x2="175" y2="140" stroke="#8B8680" stroke-width="1"/>
        <line x1="5" y1="10" x2="5" y2="140" stroke="#8B8680" stroke-width="1"/>
        <!-- 5×4 热力网格:松绿深浅 + 赭石高点 -->
        <rect x="15" y="20" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
        <rect x="48" y="20" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="81" y="20" width="28" height="28" fill="#2F6E4F" opacity="0.85"/>
        <rect x="114" y="20" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="147" y="20" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
        <rect x="15" y="53" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="48" y="53" width="28" height="28" fill="#B8651B" opacity="0.85"/>
        <rect x="81" y="53" width="28" height="28" fill="#B8651B" opacity="0.85"/>
        <rect x="114" y="53" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="147" y="53" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
        <rect x="15" y="86" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
        <rect x="48" y="86" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="81" y="86" width="28" height="28" fill="#B8651B" opacity="0.85"/>
        <rect x="114" y="86" width="28" height="28" fill="#2F6E4F" opacity="0.85"/>
        <rect x="147" y="86" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="15" y="119" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
        <rect x="48" y="119" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
        <rect x="81" y="119" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="114" y="119" width="28" height="28" fill="#2F6E4F" opacity="0.50"/>
        <rect x="147" y="119" width="28" height="28" fill="#2F6E4F" opacity="0.20"/>
      </g>
      <text class="sans" x="102" y="200" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">热力图</text>
    </g>
  </g>
</svg>
